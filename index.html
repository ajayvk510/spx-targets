<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Daily Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11;
    --text:#E8EAED;
    --muted:#6B7280;
    --up:#16C784;
    --down:#EA3943;
    --amber:#F0B90B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;font-family:'Inter',sans-serif;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  pre#box{
    font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.55;
    white-space:pre;color:var(--text);
  }
  .up-line{color:var(--up);}
  .down-line{color:var(--down);}
  .controls{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);max-width:460px;
  }
  .refresh-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);
    background:#1E242B;border:none;border-radius:7px;padding:7px 14px;cursor:pointer;
  }
  .refresh-btn:hover{background:#2A323C;}
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  .refresh-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .status{display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .dot.live{background:var(--up);}
  .dot.warn{background:var(--amber);}
  .warn-box{
    max-width:460px;padding:12px 14px;background:rgba(240,185,11,0.08);
    border:1px solid rgba(240,185,11,0.3);border-radius:8px;font-size:12.5px;
    color:#F5D98B;line-height:1.5;display:none;font-family:'Inter',sans-serif;
  }
  .error-box{
    max-width:460px;padding:12px 14px;background:rgba(234,57,67,0.08);
    border:1px solid rgba(234,57,67,0.3);border-radius:8px;font-size:12.5px;
    color:#F5A5A9;line-height:1.5;display:none;font-family:'Inter',sans-serif;
  }
  .note{max-width:460px;font-size:11.5px;color:var(--muted);text-align:center;font-family:'Inter',sans-serif;}
  @media (max-width:480px){pre#box{font-size:11.5px;}}
</style>
</head>
<body>

<div class="wrap">
  <pre id="box">Loading…</pre>
  <div class="warn-box" id="warnBox"></div>
  <div class="error-box" id="errorBox"></div>
  <div class="controls">
    <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">loading</span></span>
    <span id="fetchedText">not yet loaded</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div class="note">Previous close: Google Finance &middot; Open/current: Yahoo Finance</div>
</div>

<script>
(function(){
  const boxEl = document.getElementById('box');
  const warnBox = document.getElementById('warnBox');
  const errorBox = document.getElementById('errorBox');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const fetchedText = document.getElementById('fetchedText');
  const refreshBtn = document.getElementById('refreshBtn');

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRawT3EwXWDeuu0cj40cqoEG2Mm18emA_68-v5zG-EdYqsxzhqmZXwsnzpkGEn_DMkjGMhvs_cycjCx/pub?gid=0&single=true&output=csv';

  const YAHOO_SYMBOL = '%5EGSPC'; // ^GSPC
  const INNER = 40;

  function yahooUrl(){
    return 'https://query1.finance.yahoo.com/v8/finance/chart/' + YAHOO_SYMBOL +
      '?interval=1d&range=5d&_cb=' + Date.now();
  }

  function fmtPrice(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtPct(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '' : '');
    return sign + n.toFixed(2) + '%';
  }

  // ==============================
  // SOURCE 1: Previous close — pulls ONLY row 2, column A (A2) from the CSV
  // ==============================
  async function fetchPrevCloseFromSheet(){
    const url = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw new Error('Sheet CSV HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n').map(l => l.replace(/\r$/, ''));
    if (lines.length < 2) throw new Error('CSV has no row 2 (A2) to read');
    const a2raw = lines[1].split(',')[0].trim().replace(/^"|"$/g, '');
    const prevClose = parseFloat(a2raw);
    if (isNaN(prevClose)) throw new Error('A2 is not a number: "' + a2raw + '"');
    return prevClose;
  }

  // ==============================
  // SOURCE 2: Today's open + current price, from Yahoo (direct, proxy fallback)
  // ==============================
  async function fetchYahoo(){
    try {
      const res = await fetch(yahooUrl(), {cache:'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const result = data && data.chart && data.chart.result && data.chart.result[0];
      if (!result || !result.meta) throw new Error('unexpected payload');
      return {result, source: 'direct'};
    } catch(directErr){
      try {
        const proxied = 'https://corsproxy.io/?url=' + encodeURIComponent(yahooUrl());
        const res2 = await fetch(proxied, {cache:'no-store'});
        if (!res2.ok) throw new Error('HTTP ' + res2.status);
        const data2 = await res2.json();
        const result2 = data2 && data2.chart && data2.chart.result && data2.chart.result[0];
        if (!result2 || !result2.meta) throw new Error('unexpected payload');
        return {result: result2, source: 'proxy'};
      } catch(proxyErr){
        throw new Error('Yahoo direct failed (' + directErr.message + '); proxy fallback also failed (' + proxyErr.message + ')');
      }
    }
  }

  function todaysOpen(result){
    const meta = result.meta;
    const tz = meta.exchangeTimezoneName || 'America/New_York';
    const timestamps = result.timestamp || [];
    const opens = (result.indicators && result.indicators.quote && result.indicators.quote[0] && result.indicators.quote[0].open) || [];
    if (!timestamps.length) return null;
    const todayKey = new Date(meta.regularMarketTime * 1000).toLocaleDateString('en-CA', {timeZone: tz});
    for (let i = timestamps.length - 1; i >= 0; i--){
      const key = new Date(timestamps[i] * 1000).toLocaleDateString('en-CA', {timeZone: tz});
      if (key === todayKey && typeof opens[i] === 'number'){
        return opens[i];
      }
    }
    return null;
  }

  // ==============================
  // BOX RENDERING
  // ==============================
  function row_(label, value){
    const left = ' ' + label;
    const gapLen = Math.max(1, INNER - left.length - value.length);
    const text = (left + ' '.repeat(gapLen) + value).padEnd(INNER, ' ').slice(0, INNER);
    return '│' + text + '│';
  }
  function centered(text){
    const pad = INNER - text.length;
    const l = Math.floor(pad/2);
    const r = pad - l;
    return '│' + ' '.repeat(Math.max(l,0)) + text + ' '.repeat(Math.max(r,0)) + '│';
  }
  function blank(){
    return '│' + ' '.repeat(INNER) + '│';
  }

  function buildBox(d){
    const top    = '┌' + '─'.repeat(INNER) + '┐';
    const div    = '├' + '─'.repeat(INNER) + '┤';
    const bottom = '└' + '─'.repeat(INNER) + '┘';

    const lines = [];
    lines.push(top);
    lines.push(centered('SPX DAILY TARGETS'));
    lines.push(div);
    lines.push(blank());
    lines.push({t: row_('Previous Close', fmtPrice(d.prevClose))});
    lines.push({t: row_("Today's Open", fmtPrice(d.open))});
    lines.push({t: row_('Open Change', fmtPct(d.openChangePct)), cls: d.openChangePct > 0 ? 'up-line' : (d.openChangePct < 0 ? 'down-line' : '')});
    lines.push(blank());
    lines.push(div);
    lines.push(centered('TARGETS'));
    lines.push(blank());
    lines.push({t: row_('+0.20% Previous Close', fmtPrice(d.pcUp02)), cls:'up-line'});
    lines.push({t: row_('-0.20% Previous Close', fmtPrice(d.pcDown02)), cls:'down-line'});
    lines.push(blank());
    lines.push({t: row_('+0.50% Previous Close', fmtPrice(d.pcUp05)), cls:'up-line'});
    lines.push({t: row_('-0.50% Previous Close', fmtPrice(d.pcDown05)), cls:'down-line'});
    lines.push(blank());
    lines.push({t: row_("+0.50% Today's Open", fmtPrice(d.openUp05)), cls:'up-line'});
    lines.push({t: row_("-0.50% Today's Open", fmtPrice(d.openDown05)), cls:'down-line'});
    lines.push(blank());
    lines.push(div);
    lines.push(blank());
    lines.push({t: row_('Current SPX', fmtPrice(d.current))});
    lines.push({t: row_('Last Updated', d.lastUpdated)});
    lines.push(bottom);

    boxEl.innerHTML = '';
    lines.forEach(l => {
      const span = document.createElement('span');
      if (typeof l === 'string'){
        span.textContent = l;
      } else {
        span.textContent = l.t;
        if (l.cls) span.className = l.cls;
      }
      boxEl.appendChild(span);
      boxEl.appendChild(document.createTextNode('\n'));
    });
  }

  function marketStateLabel(state){
    switch(state){
      case 'REGULAR': return 'market open';
      case 'PRE': return 'pre-market';
      case 'POST': case 'POSTPOST': return 'after hours';
      case 'CLOSED': return 'market closed';
      default: return state ? state.toLowerCase() : 'unknown';
    }
  }

  async function load(){
    refreshBtn.disabled = true;
    warnBox.style.display = 'none';
    errorBox.style.display = 'none';

    const results = await Promise.allSettled([
      fetchPrevCloseFromSheet(),
      fetchYahoo()
    ]);

    const prevCloseResult = results[0];
    const yahooResult = results[1];

    if (prevCloseResult.status === 'rejected' && yahooResult.status === 'rejected') {
      errorBox.style.display = 'block';
      errorBox.textContent = 'Both sources failed. Sheet: ' + prevCloseResult.reason.message + ' | Yahoo: ' + yahooResult.reason.message;
      statusText.textContent = 'error';
      statusDot.classList.remove('live', 'warn');
      refreshBtn.disabled = false;
      return;
    }

    const prevClose = prevCloseResult.status === 'fulfilled' ? prevCloseResult.value : null;

    let open = null, current = null, lastUpdated = '—', yahooSource = null, marketState = null;
    if (yahooResult.status === 'fulfilled') {
      const { result, source } = yahooResult.value;
      const meta = result.meta;
      const tz = meta.exchangeTimezoneName || 'America/New_York';
      open = todaysOpen(result);
      if (open === null || open === undefined) open = prevClose;
      current = meta.regularMarketPrice;
      const quoteTime = meta.regularMarketTime ? new Date(meta.regularMarketTime * 1000) : null;
      lastUpdated = quoteTime ? quoteTime.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone: tz}) : '—';
      yahooSource = source;
      marketState = meta.marketState;
    }

    const openChangePct = (prevClose && open) ? ((open - prevClose) / prevClose) * 100 : null;

    const data = {
      prevClose, open, current, openChangePct,
      pcUp02: prevClose ? prevClose * 1.002 : null,
      pcDown02: prevClose ? prevClose * 0.998 : null,
      pcUp05: prevClose ? prevClose * 1.005 : null,
      pcDown05: prevClose ? prevClose * 0.995 : null,
      openUp05: open ? open * 1.005 : null,
      openDown05: open ? open * 0.995 : null,
      lastUpdated
    };
    buildBox(data);

    const problems = [];
    if (prevCloseResult.status === 'rejected') problems.push('Previous close (Google Sheet) failed: ' + prevCloseResult.reason.message);
    if (yahooResult.status === 'rejected') problems.push("Today's open / current price (Yahoo) failed: " + yahooResult.reason.message);
    if (yahooSource === 'proxy') problems.push('Yahoo data came through a fallback proxy — verify against another source.');

    if (problems.length){
      warnBox.style.display = 'block';
      warnBox.textContent = problems.join(' ');
      statusDot.classList.remove('live');
      statusDot.classList.add('warn');
      statusText.textContent = 'partial data';
    } else {
      statusDot.classList.add('live');
      statusDot.classList.remove('warn');
      statusText.textContent = marketState ? marketStateLabel(marketState) : 'loaded';
    }

    fetchedText.textContent = 'fetched ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', second:'2-digit'});
    refreshBtn.disabled = false;
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>

</body>
</html>
