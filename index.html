<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Daily Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a2744;
    --green:#1a7a3c;
    --green-bg:#e9f7ee;
    --green-bg2:#dcf1e4;
    --red:#a11d1d;
    --red-bg:#fbeaea;
    --red-bg2:#f7dbdb;
    --gray-bg:#f4f5f7;
    --border:#dfe2e7;
    --text:#1c1f26;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#ffffff;color:var(--text);}
  body{
    display:flex;justify-content:center;padding:14px 12px 30px;
    font-family:'Inter',sans-serif;
  }
  .card{width:100%;max-width:440px;}

  h1{
    text-align:center;color:var(--navy);font-weight:800;font-size:19px;
    letter-spacing:0.2px;
  }
  .title-rule{height:2px;background:var(--navy);margin:6px 0 12px 0;border-radius:2px;}

  table{width:100%;border-collapse:collapse;}

  .summary{margin-bottom:10px;border:1px solid var(--border);border-radius:5px;overflow:hidden;}
  .summary td{padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--border);}
  .summary tr:last-child td{border-bottom:none;}
  .summary tr:nth-child(odd){background:var(--gray-bg);}
  .summary tr:nth-child(even){background:#ffffff;}
  .summary .label{font-weight:700;width:44%;}
  .summary .value{text-align:center;font-weight:700;font-size:13px;}
  .value.up{color:var(--green);}
  .value.down{color:var(--red);}

  .bias-banner{
    text-align:center;font-weight:700;font-size:11px;letter-spacing:0.1px;
    padding:6px 8px;border-radius:5px;margin-bottom:10px;line-height:1.35;
  }
  .bias-banner.calls{background:var(--green-bg);color:var(--green);border:1px solid #b7e2c4;}
  .bias-banner.puts{background:var(--red-bg);color:var(--red);border:1px solid #e6b3b3;}
  .bias-banner.neutral{background:var(--gray-bg);color:#555;border:1px solid var(--border);}

  .targets{border:1px solid var(--border);border-radius:5px;overflow:hidden;margin-bottom:12px;}
  .targets th{
    padding:6px 4px;font-size:10.5px;font-weight:700;color:#fff;text-align:center;
  }
  .th-calls{background:var(--green);}
  .th-ref{background:var(--navy);}
  .th-puts{background:var(--red);}
  .targets .sub th{
    font-size:9.5px;font-weight:600;color:#fff;padding:4px;
  }
  .sub .sub-calls{background:#155c2e;}
  .sub .sub-ref{background:var(--navy);}
  .sub .sub-puts{background:#7d1616;}

  .targets td{
    padding:6px 4px;text-align:center;font-size:11.5px;border-bottom:1px solid var(--border);
  }
  .targets tr:last-child td{border-bottom:none;}
  .row-purchase td.tcell, .row-purchase td.lcell{background:#f0f4e8;}
  .row-purchase td.pcell, .row-purchase td.pvcell{background:#f7f0e8;}
  .row-pc td.tcell, .row-pc td.lcell{background:var(--green-bg);}
  .row-pc td.pcell, .row-pc td.pvcell{background:var(--red-bg);}
  .row-open td.tcell, .row-open td.lcell{background:var(--green-bg2);}
  .row-open td.pcell, .row-open td.pvcell{background:var(--red-bg2);}
  .ref-cell{font-size:9.5px;color:var(--navy);font-weight:500;line-height:1.2;background:#f8f9fb;}
  .tcell{color:var(--green);font-weight:700;}
  .lcell{font-weight:700;}
  .pcell{color:var(--red);font-weight:700;}
  .pvcell{font-weight:700;}

  /* NEUTRAL state: dull both sides equally */
  .targets.neutral-bias .th-calls,
  .targets.neutral-bias .sub-calls,
  .targets.neutral-bias td.tcell,
  .targets.neutral-bias td.lcell,
  .targets.neutral-bias .th-puts,
  .targets.neutral-bias .sub-puts,
  .targets.neutral-bias td.pcell,
  .targets.neutral-bias td.pvcell{
    opacity:0.4;filter:grayscale(60%);
  }

  /* STRONG bias: hide the non-favored side entirely */
  .targets.calls-only .th-puts,
  .targets.calls-only .sub-puts,
  .targets.calls-only td.pcell,
  .targets.calls-only td.pvcell{
    display:none;
  }
  .targets.calls-only .th-calls{box-shadow:inset 0 0 0 2px #0d4d24;}

  .targets.puts-only .th-calls,
  .targets.puts-only .sub-calls,
  .targets.puts-only td.tcell,
  .targets.puts-only td.lcell{
    display:none;
  }
  .targets.puts-only .th-puts{box-shadow:inset 0 0 0 2px #5c0f0f;}

  .footer{text-align:center;}
  .footer h2{
    color:var(--navy);font-weight:800;font-size:12px;letter-spacing:0.3px;
  }
  .footer-rule{height:1.5px;background:var(--navy);margin:5px 0 10px 0;border-radius:2px;}
  .last-updated-label{color:var(--navy);font-weight:600;font-size:10px;margin-bottom:2px;}
  .current-price{color:var(--navy);font-weight:800;font-size:22px;}
  .current-time{color:#5a5f6b;font-size:10.5px;margin-top:1px;}

  .controls{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;
    font-size:10px;color:#6b7280;margin-top:12px;
  }
  .refresh-btn{
    font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;color:#fff;
    background:var(--navy);border:none;border-radius:6px;padding:5px 12px;cursor:pointer;
  }
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  .status{display:flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#9ca3af;}
  .dot.live{background:var(--green);}
  .error-box{
    max-width:440px;margin:0 auto 10px auto;padding:8px 10px;background:var(--red-bg);
    border:1px solid #e6b3b3;border-radius:6px;font-size:10.5px;color:var(--red);line-height:1.4;
    display:none;
  }
  .loading-text{text-align:center;color:#6b7280;font-size:12px;padding:16px 0;}
  .source-note{text-align:center;font-size:9.5px;color:#9ca3af;margin-top:4px;}
</style>
</head>
<body>
<div class="card">
  <h1>SPX DAILY TARGETS</h1>
  <div class="title-rule"></div>

  <div class="error-box" id="errorBox"></div>

  <div id="content">
    <div class="loading-text">Loading…</div>
  </div>

  <div class="controls">
    <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">loading</span></span>
    <span id="fetchedText">not yet loaded</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div class="source-note">All data via Google Finance (typically 15–20 min delayed)</div>
</div>

<script>
(function(){
  const contentEl = document.getElementById('content');
  const errorBox = document.getElementById('errorBox');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const fetchedText = document.getElementById('fetchedText');
  const refreshBtn = document.getElementById('refreshBtn');

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRawT3EwXWDeuu0cj40cqoEG2Mm18emA_68-v5zG-EdYqsxzhqmZXwsnzpkGEn_DMkjGMhvs_cycjCx/pub?gid=0&single=true&output=csv';

  // Row definitions, in display order.
  // base: 'prevClose' or 'open'
  // noFrom: true => ref cell shows just the label, no "from" prefix line
  const ROWS = [
    { pct: 0.10, label: 'Purchasing Point', base: 'prevClose', rowCls: 'row-purchase', noFrom: true },
    { pct: 0.20, label: 'Previous Close',    base: 'prevClose', rowCls: 'row-pc' },
    { pct: 0.50, label: 'Previous Close',    base: 'prevClose', rowCls: 'row-pc' },
    { pct: 0.80, label: 'Previous Close',    base: 'prevClose', rowCls: 'row-pc' },
    { pct: 1.00, label: 'Previous Close',    base: 'prevClose', rowCls: 'row-pc' },
    { pct: 0.50, label: "Today's Open",      base: 'open',      rowCls: 'row-open' },
    { pct: 1.00, label: "Today's Open",      base: 'open',      rowCls: 'row-open' }
  ];

  // Bias threshold: at/above this, show only the favored side.
  const BIAS_THRESHOLD_PCT = 0.20;

  function fmtPrice(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtPct(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '' : '');
    return sign + n.toFixed(2) + '%';
  }

  async function fetchFromSheet(){
    const url = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw new Error('Sheet CSV HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n').map(l => l.replace(/\r$/, ''));
    if (lines.length < 2) throw new Error('CSV has no row 2 to read');
    const cols = lines[1].split(',').map(v => v.trim().replace(/^"|"$/g, ''));

    const prevClose = parseFloat(cols[0]);
    const open = parseFloat(cols[1]);
    const current = parseFloat(cols[2]);

    if (isNaN(prevClose)) throw new Error('A2 (previous close) is not a number: "' + cols[0] + '"');
    if (isNaN(open)) throw new Error('B2 (today\'s open) is not a number: "' + (cols[1] || '') + '" — did you add the today_open formula?');
    if (isNaN(current)) throw new Error('C2 (current) is not a number: "' + (cols[2] || '') + '" — did you add the current formula?');

    return { prevClose, open, current };
  }

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildSummary(prevClose, open, openChangePct){
    const table = el('table', 'summary');
    const rows = [
      ['Previous Close', fmtPrice(prevClose), null],
      ["Today's Open", fmtPrice(open), null],
      ['Open Change', fmtPct(openChangePct), openChangePct > 0 ? 'up' : (openChangePct < 0 ? 'down' : null)]
    ];
    rows.forEach(([label, value, cls]) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'label', label));
      tr.appendChild(el('td', 'value' + (cls ? ' ' + cls : ''), value));
      table.appendChild(tr);
    });
    return table;
  }

  function buildBiasBanner(bias, openChangePct){
    const banner = el('div', 'bias-banner ' + bias);
    if (bias === 'calls'){
      banner.textContent = "▲ Open +" + Math.abs(openChangePct).toFixed(2) + "% vs Prev Close — CALLS ONLY";
    } else if (bias === 'puts'){
      banner.textContent = "▼ Open -" + Math.abs(openChangePct).toFixed(2) + "% vs Prev Close — PUTS ONLY";
    } else {
      banner.textContent = "Open change (" + fmtPct(openChangePct) + ") under ±" + BIAS_THRESHOLD_PCT.toFixed(2) + "% — no bias yet";
    }
    return banner;
  }

  function buildTargets(prevClose, open, bias){
    let cls = 'targets';
    if (bias === 'calls') cls += ' calls-only';
    else if (bias === 'puts') cls += ' puts-only';
    else cls += ' neutral-bias';

    const table = el('table', cls);

    const headRow = el('tr');
    const thCalls = el('th', 'th-calls', 'CALLS (Upside)');
    thCalls.colSpan = 2;
    const thRef = el('th', 'th-ref', 'REF');
    const thPuts = el('th', 'th-puts', 'PUTS (Downside)');
    thPuts.colSpan = 2;
    headRow.appendChild(thCalls);
    headRow.appendChild(thRef);
    headRow.appendChild(thPuts);
    table.appendChild(headRow);

    const subRow = el('tr', 'sub');
    ['Target','Level'].forEach(t => subRow.appendChild(el('th', 'sub-calls', t)));
    subRow.appendChild(el('th', 'sub-ref', ''));
    ['Target','Level'].forEach(t => subRow.appendChild(el('th', 'sub-puts', t)));
    table.appendChild(subRow);

    ROWS.forEach(({pct, label, base, rowCls, noFrom}) => {
      const refBase = base === 'prevClose' ? prevClose : open;
      const upVal = refBase * (1 + pct/100);
      const downVal = refBase * (1 - pct/100);
      const tr = el('tr', rowCls);
      tr.appendChild(el('td', 'tcell', '+' + pct.toFixed(2) + '%'));
      tr.appendChild(el('td', 'lcell', fmtPrice(upVal)));

      const refTd = el('td', 'ref-cell');
      if (noFrom){
        const only = document.createElement('div'); only.textContent = label;
        refTd.appendChild(only);
      } else {
        const l1 = document.createElement('div'); l1.textContent = 'from';
        const l2 = document.createElement('div'); l2.textContent = label;
        refTd.appendChild(l1); refTd.appendChild(l2);
      }
      tr.appendChild(refTd);

      tr.appendChild(el('td', 'pcell', '-' + pct.toFixed(2) + '%'));
      tr.appendChild(el('td', 'pvcell', fmtPrice(downVal)));
      table.appendChild(tr);
    });

    return table;
  }

  function buildFooter(current, lastUpdated){
    const wrap = el('div', 'footer');
    wrap.appendChild(el('h2', null, 'CURRENT SPX'));
    wrap.appendChild(el('div', 'footer-rule'));
    wrap.appendChild(el('div', 'last-updated-label', 'Last Updated'));
    wrap.appendChild(el('div', 'current-price', fmtPrice(current)));
    wrap.appendChild(el('div', 'current-time', lastUpdated));
    return wrap;
  }

  function render(d){
    let bias = 'neutral';
    if (d.openChangePct >= BIAS_THRESHOLD_PCT) bias = 'calls';
    else if (d.openChangePct <= -BIAS_THRESHOLD_PCT) bias = 'puts';

    contentEl.innerHTML = '';
    contentEl.appendChild(buildSummary(d.prevClose, d.open, d.openChangePct));
    contentEl.appendChild(buildBiasBanner(bias, d.openChangePct));
    contentEl.appendChild(buildTargets(d.prevClose, d.open, bias));
    contentEl.appendChild(buildFooter(d.current, d.lastUpdated));
  }

  async function load(){
    refreshBtn.disabled = true;
    errorBox.style.display = 'none';

    try {
      const { prevClose, open, current } = await fetchFromSheet();
      const openChangePct = ((open - prevClose) / prevClose) * 100;
      const lastUpdated = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});

      render({ prevClose, open, current, openChangePct, lastUpdated });

      statusDot.classList.add('live');
      statusText.textContent = 'loaded';
      fetchedText.textContent = 'fetched ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', second:'2-digit'});
    } catch(e){
      errorBox.style.display = 'block';
      errorBox.textContent = e.message || 'Could not load data right now.';
      statusText.textContent = 'error';
      statusDot.classList.remove('live');
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>

</body>
</html>
