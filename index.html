<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Daily Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11;
    --text:#E8EAED;
    --muted:#6B7280;
    --up:#16C784;
    --down:#EA3943;
    --amber:#F0B90B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;font-family:'Inter',sans-serif;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  pre#box{
    font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.55;
    white-space:pre;color:var(--text);
  }
  .up-line{color:var(--up);}
  .down-line{color:var(--down);}
  .amber-line{color:var(--amber);}
  .controls{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);max-width:460px;
  }
  .refresh-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);
    background:#1E242B;border:none;border-radius:7px;padding:7px 14px;cursor:pointer;
  }
  .refresh-btn:hover{background:#2A323C;}
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  .refresh-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .status{display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .dot.live{background:var(--up);}
  .dot.warn{background:var(--amber);}
  .warn-box{
    max-width:460px;padding:12px 14px;background:rgba(240,185,11,0.08);
    border:1px solid rgba(240,185,11,0.3);border-radius:8px;font-size:12.5px;
    color:#F5D98B;line-height:1.5;display:none;font-family:'Inter',sans-serif;
  }
  .error-box{
    max-width:460px;padding:12px 14px;background:rgba(234,57,67,0.08);
    border:1px solid rgba(234,57,67,0.3);border-radius:8px;font-size:12.5px;
    color:#F5A5A9;line-height:1.5;display:none;font-family:'Inter',sans-serif;
  }
  @media (max-width:480px){pre#box{font-size:11.5px;}}
</style>
</head>
<body>

<div class="wrap">
  <pre id="box">Loading…</pre>
  <div class="warn-box" id="warnBox"></div>
  <div class="error-box" id="errorBox"></div>
  <div class="controls">
    <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">loading</span></span>
    <span id="sourceText"></span>
    <span id="fetchedText">not yet loaded</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
</div>

<script>
(function(){
  const boxEl = document.getElementById('box');
  const warnBox = document.getElementById('warnBox');
  const errorBox = document.getElementById('errorBox');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const sourceText = document.getElementById('sourceText');
  const fetchedText = document.getElementById('fetchedText');
  const refreshBtn = document.getElementById('refreshBtn');

  const SYMBOL = '%5EGSPC'; // ^GSPC
  const INNER = 40;
  const STALE_MS = 15 * 60 * 1000; // flag if quote is older than 15 min

  function baseUrl(){
    // cache-busting param so no CDN/edge cache serves an old response
    return 'https://query1.finance.yahoo.com/v8/finance/chart/' + SYMBOL +
      '?interval=1d&range=5d&_cb=' + Date.now();
  }

  function fmtPrice(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtPct(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '' : '');
    return sign + n.toFixed(2) + '%';
  }

  async function fetchQuote(){
    // 1) Try direct — no proxy, no cache.
    try {
      const res = await fetch(baseUrl(), {cache:'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const result = data && data.chart && data.chart.result && data.chart.result[0];
      if (!result || !result.meta) throw new Error('unexpected payload');
      return {result, source: 'direct'};
    } catch(directErr){
      // 2) Fallback to a cache-busted proxy — flagged clearly if used.
      try {
        const proxied = 'https://corsproxy.io/?url=' + encodeURIComponent(baseUrl()) + '&_cb2=' + Date.now();
        const res2 = await fetch(proxied, {cache:'no-store'});
        if (!res2.ok) throw new Error('HTTP ' + res2.status);
        const data2 = await res2.json();
        const result2 = data2 && data2.chart && data2.chart.result && data2.chart.result[0];
        if (!result2 || !result2.meta) throw new Error('unexpected payload');
        return {result: result2, source: 'proxy'};
      } catch(proxyErr){
        throw new Error('Direct fetch failed (' + directErr.message + '); proxy fallback also failed (' + proxyErr.message + ')');
      }
    }
  }

  function todaysOpen(result){
    const meta = result.meta;
    const tz = meta.exchangeTimezoneName || 'America/New_York';
    const timestamps = result.timestamp || [];
    const opens = (result.indicators && result.indicators.quote && result.indicators.quote[0] && result.indicators.quote[0].open) || [];
    if (!timestamps.length) return null;

    const todayKey = new Date(meta.regularMarketTime * 1000).toLocaleDateString('en-CA', {timeZone: tz});
    for (let i = timestamps.length - 1; i >= 0; i--){
      const key = new Date(timestamps[i] * 1000).toLocaleDateString('en-CA', {timeZone: tz});
      if (key === todayKey && typeof opens[i] === 'number'){
        return opens[i];
      }
    }
    return null;
  }

  function row(label, value){
    const left = ' ' + label;
    const gapLen = Math.max(1, INNER - left.length - value.length);
    const text = (left + ' '.repeat(gapLen) + value).padEnd(INNER, ' ').slice(0, INNER);
    return '│' + text + '│';
  }
  function centered(text){
    const pad = INNER - text.length;
    const l = Math.floor(pad/2);
    const r = pad - l;
    return '│' + ' '.repeat(Math.max(l,0)) + text + ' '.repeat(Math.max(r,0)) + '│';
  }
  function blank(){
    return '│' + ' '.repeat(INNER) + '│';
  }

  function buildBox(d){
    const top    = '┌' + '─'.repeat(INNER) + '┐';
    const div    = '├' + '─'.repeat(INNER) + '┤';
    const bottom = '└' + '─'.repeat(INNER) + '┘';

    const lines = [];
    lines.push(top);
    lines.push(centered('SPX DAILY TARGETS'));
    lines.push(div);
    lines.push(blank());
    lines.push({t: row('Previous Close', fmtPrice(d.prevClose))});
    lines.push({t: row("Today's Open", fmtPrice(d.open))});
    lines.push({t: row('Open Change', fmtPct(d.openChangePct)), cls: d.openChangePct > 0 ? 'up-line' : (d.openChangePct < 0 ? 'down-line' : '')});
    lines.push(blank());
    lines.push(div);
    lines.push(centered('TARGETS'));
    lines.push(blank());
    lines.push({t: row('+0.20% Previous Close', fmtPrice(d.pcUp02)), cls:'up-line'});
    lines.push({t: row('-0.20% Previous Close', fmtPrice(d.pcDown02)), cls:'down-line'});
    lines.push(blank());
    lines.push({t: row('+0.50% Previous Close', fmtPrice(d.pcUp05)), cls:'up-line'});
    lines.push({t: row('-0.50% Previous Close', fmtPrice(d.pcDown05)), cls:'down-line'});
    lines.push(blank());
    lines.push({t: row("+0.50% Today's Open", fmtPrice(d.openUp05)), cls:'up-line'});
    lines.push({t: row("-0.50% Today's Open", fmtPrice(d.openDown05)), cls:'down-line'});
    lines.push(blank());
    lines.push(div);
    lines.push(blank());
    lines.push({t: row('Current SPX', fmtPrice(d.current))});
    lines.push({t: row('Last Updated', d.lastUpdated)});
    lines.push(bottom);

    boxEl.innerHTML = '';
    lines.forEach(l => {
      const span = document.createElement('span');
      if (typeof l === 'string'){
        span.textContent = l;
      } else {
        span.textContent = l.t;
        if (l.cls) span.className = l.cls;
      }
      boxEl.appendChild(span);
      boxEl.appendChild(document.createTextNode('\n'));
    });
  }

  function marketStateLabel(state){
    switch(state){
      case 'REGULAR': return 'market open';
      case 'PRE': return 'pre-market';
      case 'POST': case 'POSTPOST': return 'after hours';
      case 'CLOSED': return 'market closed';
      default: return state ? state.toLowerCase() : 'unknown';
    }
  }

  async function load(){
    refreshBtn.disabled = true;
    warnBox.style.display = 'none';
    try {
      const {result, source} = await fetchQuote();
      const meta = result.meta;
      const tz = meta.exchangeTimezoneName || 'America/New_York';
      const prevClose = meta.chartPreviousClose || meta.previousClose;
      let open = todaysOpen(result);
      if (open === null || open === undefined) open = prevClose;
      const openChangePct = ((open - prevClose) / prevClose) * 100;
      const quoteTime = meta.regularMarketTime ? new Date(meta.regularMarketTime * 1000) : null;
      const lastUpdated = quoteTime
        ? quoteTime.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone: tz})
        : '—';

      const data = {
        prevClose, open, current: meta.regularMarketPrice,
        openChangePct,
        pcUp02: prevClose * 1.002,
        pcDown02: prevClose * 0.998,
        pcUp05: prevClose * 1.005,
        pcDown05: prevClose * 0.995,
        openUp05: open * 1.005,
        openDown05: open * 0.995,
        lastUpdated
      };
      buildBox(data);

      // Staleness check — independent of which path we used.
      const ageMs = quoteTime ? (Date.now() - quoteTime.getTime()) : null;
      const isStale = ageMs !== null && ageMs > STALE_MS && meta.marketState === 'REGULAR';

      if (source === 'proxy'){
        warnBox.style.display = 'block';
        warnBox.textContent = 'Direct fetch was blocked, so this came through a fallback proxy — double-check this number against another source before trusting it.';
      } else if (isStale){
        warnBox.style.display = 'block';
        warnBox.textContent = 'Quote timestamp is over 15 minutes old during market hours — data may be delayed or stuck. Try Refresh.';
      }

      statusText.textContent = marketStateLabel(meta.marketState);
      statusDot.classList.toggle('live', meta.marketState === 'REGULAR' && !isStale && source === 'direct');
      statusDot.classList.toggle('warn', source === 'proxy' || isStale);
      sourceText.textContent = 'source: ' + source;
      errorBox.style.display = 'none';
      fetchedText.textContent = 'fetched ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', second:'2-digit'});
    } catch(e){
      errorBox.style.display = 'block';
      errorBox.textContent = e.message || 'Could not load a live price right now.';
      statusText.textContent = 'error';
      statusDot.classList.remove('live');
      statusDot.classList.remove('warn');
      sourceText.textContent = '';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', load);
  load(); // fetch once on load; no auto-refresh loop
})();
</script>

</body>
</html>
