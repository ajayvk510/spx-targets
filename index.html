<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Daily Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a2744;
    --green:#1a7a3c;
    --green-bg:#e9f7ee;
    --green-bg2:#dcf1e4;
    --red:#a11d1d;
    --red-bg:#fbeaea;
    --red-bg2:#f7dbdb;
    --gray-bg:#f4f5f7;
    --border:#dfe2e7;
    --text:#1c1f26;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#ffffff;color:var(--text);}
  body{
    display:flex;justify-content:center;padding:28px 16px 60px;
    font-family:'Inter',sans-serif;
  }
  .card{width:100%;max-width:640px;}

  h1{
    text-align:center;color:var(--navy);font-weight:800;font-size:30px;
    letter-spacing:0.3px;
  }
  .title-rule{height:3px;background:var(--navy);margin:10px 0 22px 0;border-radius:2px;}

  table{width:100%;border-collapse:collapse;}

  .summary{margin-bottom:16px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .summary td{padding:14px 16px;font-size:16px;border-bottom:1px solid var(--border);}
  .summary tr:last-child td{border-bottom:none;}
  .summary tr:nth-child(odd){background:var(--gray-bg);}
  .summary tr:nth-child(even){background:#ffffff;}
  .summary .label{font-weight:700;width:44%;}
  .summary .value{text-align:center;font-weight:700;font-size:18px;}
  .value.up{color:var(--green);}
  .value.down{color:var(--red);}

  .bias-banner{
    text-align:center;font-weight:700;font-size:13.5px;letter-spacing:0.3px;
    padding:10px 14px;border-radius:6px;margin-bottom:20px;
  }
  .bias-banner.calls{background:var(--green-bg);color:var(--green);border:1px solid #b7e2c4;}
  .bias-banner.puts{background:var(--red-bg);color:var(--red);border:1px solid #e6b3b3;}
  .bias-banner.neutral{background:var(--gray-bg);color:#555;border:1px solid var(--border);}

  .targets{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:26px;transition:opacity 0.2s ease, filter 0.2s ease;}
  .targets th{
    padding:12px 8px;font-size:14px;font-weight:700;color:#fff;text-align:center;
    transition:opacity 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
  }
  .th-calls{background:var(--green);}
  .th-ref{background:var(--navy);}
  .th-puts{background:var(--red);}
  .targets .sub th{
    font-size:12.5px;font-weight:600;color:#fff;padding:8px;
    transition:opacity 0.2s ease, filter 0.2s ease;
  }
  .sub .sub-calls{background:#155c2e;}
  .sub .sub-ref{background:var(--navy);}
  .sub .sub-puts{background:#7d1616;}

  .targets td{
    padding:14px 8px;text-align:center;font-size:15px;border-bottom:1px solid var(--border);
    transition:opacity 0.2s ease, filter 0.2s ease;
  }
  .targets tr:last-child td{border-bottom:none;}
  .row-pc td.tcell, .row-pc td.lcell{background:var(--green-bg);}
  .row-pc td.pcell, .row-pc td.pvcell{background:var(--red-bg);}
  .row-open td.tcell, .row-open td.lcell{background:var(--green-bg2);}
  .row-open td.pcell, .row-open td.pvcell{background:var(--red-bg2);}
  .ref-cell{font-size:13px;color:var(--navy);font-weight:500;line-height:1.3;background:#f8f9fb;}
  .tcell{color:var(--green);font-weight:700;}
  .lcell{font-weight:700;}
  .pcell{color:var(--red);font-weight:700;}
  .pvcell{font-weight:700;}

  /* Bias styling: dim the unfavored side, emphasize the favored side */
  .targets.calls-bias .th-puts,
  .targets.calls-bias .sub-puts,
  .targets.calls-bias td.pcell,
  .targets.calls-bias td.pvcell{
    opacity:0.35;filter:grayscale(55%);
  }
  .targets.calls-bias .th-calls{box-shadow:inset 0 0 0 2px #0d4d24;}
  .targets.calls-bias td.tcell,
  .targets.calls-bias td.lcell{font-weight:800;}

  .targets.puts-bias .th-calls,
  .targets.puts-bias .sub-calls,
  .targets.puts-bias td.tcell,
  .targets.puts-bias td.lcell{
    opacity:0.35;filter:grayscale(55%);
  }
  .targets.puts-bias .th-puts{box-shadow:inset 0 0 0 2px #5c0f0f;}
  .targets.puts-bias td.pcell,
  .targets.puts-bias td.pvcell{font-weight:800;}

  .footer{text-align:center;}
  .footer h2{
    color:var(--navy);font-weight:800;font-size:18px;letter-spacing:0.5px;
  }
  .footer-rule{height:2px;background:var(--navy);margin:8px 0 18px 0;border-radius:2px;}
  .last-updated-label{color:var(--navy);font-weight:600;font-size:13px;margin-bottom:4px;}
  .current-price{color:var(--navy);font-weight:800;font-size:34px;}
  .current-time{color:#5a5f6b;font-size:14px;margin-top:2px;}

  .controls{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;
    font-size:12px;color:#6b7280;margin-top:22px;
  }
  .refresh-btn{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:#fff;
    background:var(--navy);border:none;border-radius:7px;padding:8px 16px;cursor:pointer;
  }
  .refresh-btn:disabled{opacity:0.5;cursor:default;}
  .status{display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#9ca3af;}
  .dot.live{background:var(--green);}
  .error-box{
    max-width:600px;margin:0 auto 18px auto;padding:12px 14px;background:var(--red-bg);
    border:1px solid #e6b3b3;border-radius:8px;font-size:12.5px;color:var(--red);line-height:1.5;
    display:none;
  }
  .loading-text{text-align:center;color:#6b7280;font-size:14px;padding:30px 0;}
  .source-note{text-align:center;font-size:11.5px;color:#9ca3af;margin-top:6px;}

  @media (max-width:480px){
    h1{font-size:24px;}
    .summary td{padding:11px 12px;font-size:14px;}
    .summary .value{font-size:15px;}
    .targets td, .targets th{padding:9px 4px;font-size:12.5px;}
    .targets .sub th{font-size:10.5px;}
    .ref-cell{font-size:10.5px;}
    .current-price{font-size:26px;}
  }
</style>
</head>
<body>
<div class="card">
  <h1>SPX DAILY TARGETS</h1>
  <div class="title-rule"></div>

  <div class="error-box" id="errorBox"></div>

  <div id="content">
    <div class="loading-text">Loading…</div>
  </div>

  <div class="controls">
    <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">loading</span></span>
    <span id="fetchedText">not yet loaded</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div class="source-note">All data via Google Finance (typically 15–20 min delayed)</div>
</div>

<script>
(function(){
  const contentEl = document.getElementById('content');
  const errorBox = document.getElementById('errorBox');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const fetchedText = document.getElementById('fetchedText');
  const refreshBtn = document.getElementById('refreshBtn');

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRawT3EwXWDeuu0cj40cqoEG2Mm18emA_68-v5zG-EdYqsxzhqmZXwsnzpkGEn_DMkjGMhvs_cycjCx/pub?gid=0&single=true&output=csv';

  const PC_PCTS = [0.20, 0.50, 0.80, 1.00];   // from Previous Close
  const OPEN_PCTS = [0.50, 1.00];             // from Today's Open

  // Below this % change, treat the open as flat/neutral rather than biased.
  const NEUTRAL_THRESHOLD_PCT = 0.02;

  function fmtPrice(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtPct(n){
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '' : '');
    return sign + n.toFixed(2) + '%';
  }

  async function fetchFromSheet(){
    const url = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw new Error('Sheet CSV HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n').map(l => l.replace(/\r$/, ''));
    if (lines.length < 2) throw new Error('CSV has no row 2 to read');
    const cols = lines[1].split(',').map(v => v.trim().replace(/^"|"$/g, ''));

    const prevClose = parseFloat(cols[0]);
    const open = parseFloat(cols[1]);
    const current = parseFloat(cols[2]);

    if (isNaN(prevClose)) throw new Error('A2 (previous close) is not a number: "' + cols[0] + '"');
    if (isNaN(open)) throw new Error('B2 (today\'s open) is not a number: "' + (cols[1] || '') + '" — did you add the today_open formula?');
    if (isNaN(current)) throw new Error('C2 (current) is not a number: "' + (cols[2] || '') + '" — did you add the current formula?');

    return { prevClose, open, current };
  }

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildSummary(prevClose, open, openChangePct){
    const table = el('table', 'summary');
    const rows = [
      ['Previous Close', fmtPrice(prevClose), null],
      ["Today's Open", fmtPrice(open), null],
      ['Open Change', fmtPct(openChangePct), openChangePct > 0 ? 'up' : (openChangePct < 0 ? 'down' : null)]
    ];
    rows.forEach(([label, value, cls]) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'label', label));
      tr.appendChild(el('td', 'value' + (cls ? ' ' + cls : ''), value));
      table.appendChild(tr);
    });
    return table;
  }

  function buildBiasBanner(bias, openChangePct){
    const banner = el('div', 'bias-banner ' + bias);
    if (bias === 'calls'){
      banner.textContent = "▲ Today's Open is above Previous Close (" + fmtPct(openChangePct) + ") — CALLS favored";
    } else if (bias === 'puts'){
      banner.textContent = "▼ Today's Open is below Previous Close (" + fmtPct(openChangePct) + ") — PUTS favored";
    } else {
      banner.textContent = "Today's Open is essentially flat vs Previous Close — no directional bias";
    }
    return banner;
  }

  function buildTargets(prevClose, open, bias){
    const cls = bias === 'calls' ? 'targets calls-bias' : (bias === 'puts' ? 'targets puts-bias' : 'targets');
    const table = el('table', cls);

    const headRow = el('tr');
    const thCalls = el('th', 'th-calls', 'CALLS (Upside Targets)');
    thCalls.colSpan = 2;
    const thRef = el('th', 'th-ref', 'REFERENCE');
    const thPuts = el('th', 'th-puts', 'PUTS (Downside Targets)');
    thPuts.colSpan = 2;
    headRow.appendChild(thCalls);
    headRow.appendChild(thRef);
    headRow.appendChild(thPuts);
    table.appendChild(headRow);

    const subRow = el('tr', 'sub');
    ['Target','Level'].forEach(t => subRow.appendChild(el('th', 'sub-calls', t)));
    subRow.appendChild(el('th', 'sub-ref', ''));
    ['Target','Level'].forEach(t => subRow.appendChild(el('th', 'sub-puts', t)));
    table.appendChild(subRow);

    function addRow(pct, refLabel, refBase, rowCls){
      const upVal = refBase * (1 + pct/100);
      const downVal = refBase * (1 - pct/100);
      const tr = el('tr', rowCls);
      tr.appendChild(el('td', 'tcell', '+' + pct.toFixed(2) + '%'));
      tr.appendChild(el('td', 'lcell', fmtPrice(upVal)));
      const refTd = el('td', 'ref-cell');
      const l1 = document.createElement('div'); l1.textContent = 'from';
      const l2 = document.createElement('div'); l2.textContent = refLabel;
      refTd.appendChild(l1); refTd.appendChild(l2);
      tr.appendChild(refTd);
      tr.appendChild(el('td', 'pcell', '-' + pct.toFixed(2) + '%'));
      tr.appendChild(el('td', 'pvcell', fmtPrice(downVal)));
      table.appendChild(tr);
    }

    PC_PCTS.forEach(pct => addRow(pct, 'Previous Close', prevClose, 'row-pc'));
    OPEN_PCTS.forEach(pct => addRow(pct, "Today's Open", open, 'row-open'));

    return table;
  }

  function buildFooter(current, lastUpdated){
    const wrap = el('div', 'footer');
    wrap.appendChild(el('h2', null, 'CURRENT SPX'));
    wrap.appendChild(el('div', 'footer-rule'));
    wrap.appendChild(el('div', 'last-updated-label', 'Last Updated'));
    wrap.appendChild(el('div', 'current-price', fmtPrice(current)));
    wrap.appendChild(el('div', 'current-time', lastUpdated));
    return wrap;
  }

  function render(d){
    let bias = 'neutral';
    if (d.openChangePct > NEUTRAL_THRESHOLD_PCT) bias = 'calls';
    else if (d.openChangePct < -NEUTRAL_THRESHOLD_PCT) bias = 'puts';

    contentEl.innerHTML = '';
    contentEl.appendChild(buildSummary(d.prevClose, d.open, d.openChangePct));
    contentEl.appendChild(buildBiasBanner(bias, d.openChangePct));
    contentEl.appendChild(buildTargets(d.prevClose, d.open, bias));
    contentEl.appendChild(buildFooter(d.current, d.lastUpdated));
  }

  async function load(){
    refreshBtn.disabled = true;
    errorBox.style.display = 'none';

    try {
      const { prevClose, open, current } = await fetchFromSheet();
      const openChangePct = ((open - prevClose) / prevClose) * 100;
      const lastUpdated = new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});

      render({ prevClose, open, current, openChangePct, lastUpdated });

      statusDot.classList.add('live');
      statusText.textContent = 'loaded';
      fetchedText.textContent = 'fetched ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', second:'2-digit'});
    } catch(e){
      errorBox.style.display = 'block';
      errorBox.textContent = e.message || 'Could not load data right now.';
      statusText.textContent = 'error';
      statusDot.classList.remove('live');
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>

</body>
</html>
