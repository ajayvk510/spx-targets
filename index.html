<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Daily Targets</title>

  :root{
    --bg:#0B0E11;
    --text:#E8EAED;
    --muted:#6B7280;
    --up:#16C784;

    --amber:#F0B90B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}

  }

    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  pre#box{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    line-height:1.55;
    white-space:pre;
    color:var(--text);
  }
  .up-line{color:var(--up);}
  .down-line{color:var(--down);}
  .amber-line{color:var(--amber);}
  .controls{

    align-items:center;

    color:var(--muted);

    color:var(--text);

    border:none;
    border-radius:7px;
    padding:7px 14px;
    cursor:pointer;
  }

  .refresh-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
